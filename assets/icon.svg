<?xml version="1.0" encoding="UTF-8"?>
<!--
  概念:输入栏 + 可开关的功能模块
  下面那条长圆角框是输入框(宿主渲染,不是我们画的控件),上面三个方块是这个 App 往输入栏里塞的能力。
  一实两空 —— 实心是开着的功能,空心是关着的。这不是装饰,是"每种功能可选开关"这个核心诉求的图形化。
  图形直接描述用户每天盯着的那条输入栏,不画"工具箱"这种抽象容器:容器是实现,输入栏才是产品。

  设计权重(改动前先读):
  - 跟 prompt-polisher 同源,24px 线性单色 currentColor。两枚都是输入栏插件,风格必须成对;
    扩展列表里它们会挨着出现,不同源的两套画法会被读成两个不同生态的东西。
  - 不用彩色:宿主会按主题给 currentColor 上色,自填颜色就锁死在一套主题里,
    深色模式下会变黑块。minimax-quota / meeting-minutes 那种彩色底是另一类图标(带数据可视化语义),
    这里一行状态都渲染不了,底色只会徒增噪声。
  - 尺寸是 B' 而不是初版 B(方块 3.9 / 描边 1.7)。初版在扩展详情页的 48px 下,
    3.9 边长减去 2×0.85 的居中描边,内孔只剩 2.2px,抗锯齿一糊就读成实心,
    "一实两空"这个核心语义直接消失 —— 而那正是这枚图标存在的全部理由。
    B' 把边长加到 4.7、描边收到 1.5,内孔回到 3.2px,任意尺寸下都咬得住。
  - 三个模块左右各留 3.7 边距、彼此间隔 1.25,横向精确居中。改任何一个 x 就重新校这个数。
  - 整体重心偏下是故意的:输入框是主体,模块是附属,视觉权重应当压在下面。
  - 输入框那栏 stroke 单独用 1.6:它比模块宽得多,同粗会让下半截明显重于上半截。
  - currentColor 前提:宿主必须内联渲染这个 SVG。走 <img> 加载时 currentColor 会解析成黑色,
    深色主题下会看不见。prompt-polisher 同样用 currentColor 且当前显示正常,故沿用同一前提。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 模块一:开着的(实心)。刻意排在最左,让"有一个功能正在工作"成为第一眼读到的信息。 -->
  <rect x="3.7" y="8.2" width="4.7" height="4.7" rx="1.4" fill="currentColor" stroke="none"/>
  <!-- 模块二、模块三:关着的(空心轮廓) -->
  <rect x="9.65" y="8.2" width="4.7" height="4.7" rx="1.4"/>
  <rect x="15.6" y="8.2" width="4.7" height="4.7" rx="1.4"/>
  <!-- 输入栏本体。stroke 略重于模块,压住下半截的视觉重量。 -->
  <rect x="2.5" y="15.6" width="19" height="5.4" rx="1.5" stroke-width="1.6"/>
</svg>
